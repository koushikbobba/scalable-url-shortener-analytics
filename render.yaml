services:
  # ─── Node.js / Express Backend ────────────────────────────────────────────────
  - type: web
    name: linkstream-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas connection string)
      - key: REDIS_URL
        sync: false # Set in Render Dashboard (Upstash or Redis Cloud URL)
      - key: JWT_SECRET
        generateValue: true
      - key: SHORT_DOMAIN_BASE
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ─── React 18 Frontend ────────────────────────────────────────────────────────
  - type: web
    name: linkstream-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
